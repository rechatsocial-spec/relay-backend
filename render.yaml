# Render Blueprint — New > Blueprint > pick this repo. Fill the `sync: false`
# variables in the dashboard when prompted. Keep a single instance (no scaling):
# campaigns are sent by an in-process worker.
databases:
  - name: relay-db
    plan: basic-256mb        # the free Postgres plan expires after 30 days
    databaseName: relay_crm

services:
  - type: web
    name: relay-backend
    runtime: python
    plan: starter            # free services sleep, which makes webhooks unreliable
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase: { name: relay-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_MOCK
        value: "false"
      - key: CAMPAIGN_SEND_INTERVAL_SECONDS
        value: "5"
      - key: UNIPILE_API_KEY
        sync: false
      - key: UNIPILE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL          # https://<service-name>.onrender.com
        sync: false
      - key: CORS_ORIGINS             # JSON list, e.g. ["https://app.yourdomain.com"]
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
